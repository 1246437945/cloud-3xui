name: 3x-ui VLESS Node

on:
  workflow_dispatch:
    inputs:
      panel_password:
        description: |-
          Panel password (leave empty to use PANEL_PASSWORD secret)
          面板密码（留空则使用 PANEL_PASSWORD secret）
        required: false
      run_minutes:
        description: |-
          Run duration in minutes (default 290, max 340)
          运行时长（分钟，默认 290，最多 340）
        required: false
        default: '290'
      countdown_interval:
        description: |-
          Countdown output interval (default 1, 0 to disable)
          倒计时输出间隔（默认 1，填 0 关闭）
        required: false
        default: '1'
      countdown_unit:
        description: |-
          Countdown interval unit
          倒计时输出间隔单位
        required: false
        default: 'minutes'
        type: choice
        options:
          - minutes
          - seconds

permissions:
  actions: write

env:
  VLESS_HOST: vless.my-github.ccwu.cc
  PANEL_HOST: panel.my-github.ccwu.cc
  WS_PORT: 8080
  PANEL_PORT: 2053

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install 3x-ui
        env:
          PANEL_PASSWORD: ${{ inputs.panel_password || secrets.PANEL_PASSWORD }}
        run: |
          [ -z "$PANEL_PASSWORD" ] && { echo "请设置 panel_password 参数或 PANEL_PASSWORD secret | Set panel_password input or PANEL_PASSWORD secret"; exit 1; }
          curl -Ls https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh -o /tmp/install-3xui.sh
          sudo XUI_USERNAME="admin" \
            XUI_PASSWORD="$PANEL_PASSWORD" \
            XUI_PANEL_PORT="${{ env.PANEL_PORT }}" \
            XUI_WEB_BASE_PATH="panel" \
            bash /tmp/install-3xui.sh
          sudo systemctl is-active x-ui

      - name: Create VLESS+WS inbound via API
        env:
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
        run: |
          sudo apt-get install -y -qq python3-requests > /dev/null 2>&1 || pip install -q requests
          python3 << 'PYEOF'
          import requests, json, uuid, time, sys, os, subprocess

          PANEL = f"http://127.0.0.1:${{ env.PANEL_PORT }}/panel"
          WS_PORT = int("${{ env.WS_PORT }}")

          r = subprocess.run(["sudo", "/usr/local/x-ui/x-ui", "setting", "-getApiToken"],
                             capture_output=True, text=True, timeout=15)
          token = ""
          for line in r.stdout.splitlines():
              if "apiToken:" in line:
                  token = line.split("apiToken:")[1].strip()
                  break
          if not token:
              print("未获取到 API token | No API token"); sys.exit(1)
          headers = {"Authorization": f"Bearer {token}"}
          for _ in range(30):
              try:
                  rr = requests.get(PANEL + "/panel/api/inbounds/list", headers=headers, timeout=5)
                  if rr.status_code in (200, 401):
                      break
              except Exception:
                  pass
              time.sleep(2)

          client_uuid = os.environ.get("VLESS_UUID", "") or str(uuid.uuid4())
          inbound = {
              "enable": True, "remark": "vless-ws", "listen": "", "port": WS_PORT,
              "protocol": "vless", "expiryTime": 0, "total": 0,
              "settings": {
                  "clients": [{"id": client_uuid, "email": "gh-user", "enable": True,
                               "limitIp": 0, "totalGB": 0, "expiryTime": 0}],
                  "decryption": "none", "fallbacks": []
              },
              "streamSettings": {
                  "network": "ws", "security": "none",
                  "wsSettings": {"path": "/ws", "headers": {}}
              },
              "sniffing": {"enabled": True, "destOverride": ["http", "tls"]}
          }
          rr = requests.post(PANEL + "/panel/api/inbounds/add", json=inbound,
                             headers=headers, timeout=15)
          print("创建入站 Add inbound:", rr.status_code)
          if rr.status_code != 200 or not rr.json().get("success", False):
              print(rr.text[:500]); sys.exit(1)
          print("入站创建成功 Inbound created OK")
          open("/tmp/vless_uuid.txt", "w").write(client_uuid)
          PYEOF

      - name: Start named Cloudflare tunnel
        run: |
          curl -Ls https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /tmp/tunnel.log 2>&1 &
          echo "等待隧道连接 Waiting for tunnel to connect..."
          for i in $(seq 1 30); do
            grep -q "Registered tunnel connection" /tmp/tunnel.log && break
            sleep 2
          done
          grep -q "Registered tunnel connection" /tmp/tunnel.log || { echo "隧道失败 Tunnel failed"; cat /tmp/tunnel.log; exit 1; }
          echo ""
          echo "=================================================="
          echo "  面板 Panel: https://${{ env.PANEL_HOST }}/panel  (admin / 你的密码 your password)"
          echo ""
          echo "  VLESS 节点 node:"
          echo "  vless://YOUR_UUID@${{ env.VLESS_HOST }}:443?encryption=none&security=tls&sni=${{ env.VLESS_HOST }}&type=ws&path=%2Fws#GitHub-3xui"
          echo ""
          echo "  把 YOUR_UUID 换成你在 VLESS_UUID secret 里填的 UUID"
          echo "  Replace YOUR_UUID with the UUID from your VLESS_UUID secret"
          echo "=================================================="

      - name: Keep alive
        run: |
          MINS=${{ inputs.run_minutes }}
          echo "节点运行 $MINS 分钟后自动重启 Node alive for $MINS minutes, then auto-restart"
          END=$(( $(date +%s) + MINS * 60 ))
          INTERVAL=${{ inputs.countdown_interval }}
          UNIT=${{ inputs.countdown_unit }}
          if [ "$UNIT" = "seconds" ]; then INTERVAL_SEC=$INTERVAL; else INTERVAL_SEC=$((INTERVAL * 60)); fi
          ELAPSED=0; LAST_CD=0; LAST_HC=0
          while [ $(date +%s) -lt $END ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            if [ $((ELAPSED - LAST_HC)) -ge 60 ]; then
              LAST_HC=$ELAPSED
              sudo systemctl is-active x-ui >/dev/null || echo "警告 WARNING: x-ui not active"
              pgrep -f "cloudflared tunnel" >/dev/null || { echo "警告 WARNING: cloudflared died"; break; }
            fi
            if [ "$INTERVAL_SEC" -gt 0 ] && [ $((ELAPSED - LAST_CD)) -ge "$INTERVAL_SEC" ]; then
              LAST_CD=$ELAPSED
              LEFT=$(( (END - $(date +%s)) / 60 ))
              H=$(( LEFT / 60 )); M=$(( LEFT % 60 ))
              echo "剩余 $H 小时 $M 分钟 / Remaining ${H}h ${M}m"
            fi
          done

      - name: Trigger next run (auto-restart)
        # Skip on manual cancel, so user can stop the loop
        if: ${{ !cancelled() }}
        run: |
          echo "触发下一次运行 Triggering next run..."
          HTTP_CODE=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/3xui.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"run_minutes\":\"${{ inputs.run_minutes }}\",\"countdown_interval\":\"${{ inputs.countdown_interval }}\",\"countdown_unit\":\"${{ inputs.countdown_unit }}\"}}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/dispatch_resp.txt; echo ""
          [ "$HTTP_CODE" = "204" ] && echo "已触发下一次运行 Next run triggered" || { echo "触发失败 Trigger failed"; exit 1; }
